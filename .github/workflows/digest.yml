name: Daily digest email
on:
  schedule:
    - cron: "30 15 * * *" # 15:30 UTC = 21:00 IST
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger digest endpoint
        run: |
          curl -fsS -X POST -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ vars.SITE_URL || 'https://karma-design-studio.essanciaonline.workers.dev' }}/api/cron/digest"
