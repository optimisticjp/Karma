name: Run front desk UX patch

on:
  push:
    branches:
      - feat/fees-and-console-ux
    paths:
      - .github/workflows/run-fees-console-patch.yml
      - .github/scripts/fix_set_based_test.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/fees-and-console-ux
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Apply front desk patch
        run: |
          python .github/scripts/apply_front_desk_patch.py
          python .github/scripts/fix_front_desk_patch.py
          python .github/scripts/fix_set_based_test.py
      - run: npm ci
      - name: Verify patch
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "optimisticjp"
          git config user.email "optimistic.jp@gmail.com"
          git add messages src tests docs/project-context.md
          git diff --cached --check
          git commit -m "feat: simplify front desk fees and admission recovery"
          git push origin HEAD:feat/fees-and-console-ux
