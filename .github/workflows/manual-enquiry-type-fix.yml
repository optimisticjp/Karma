name: Manual enquiry type correction

on:
  push:
    branches:
      - fix/admission-flow-reliability
    paths:
      - .github/workflows/manual-enquiry-type-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admission-flow-reliability
      - name: Correct validator narrowing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/lib/admin/admissions.ts')
          text = p.read_text()
          old = '  const assignedTo = optionalPositiveId(input.assignedTo);\n  const nextFollowUp = optionalDate(input.nextFollowUp);\n\n  let closureReason: string | null = null;'
          new = '  const assignedTo = optionalPositiveId(input.assignedTo);\n  const nextFollowUp = optionalDate(input.nextFollowUp);\n  if (assignedTo === undefined || nextFollowUp === undefined) return { ok: false };\n\n  let closureReason: string | null = null;'
          if old not in text:
              raise SystemExit('application update narrowing marker missing')
          text = text.replace(old, new, 1)
          old = '  if (assignedTo === undefined || nextFollowUp === undefined) return { ok: false };\n\n  return {\n    ok: true,\n    value: {\n      fullName,'
          new = '  if (assignedTo === undefined || nextFollowUp === undefined) {\n    const fallback: ManualEnquiryField[] = [];\n    if (assignedTo === undefined) fallback.push("assignedTo");\n    if (nextFollowUp === undefined) fallback.push("nextFollowUp");\n    return { ok: false, invalidFields: fallback };\n  }\n\n  return {\n    ok: true,\n    value: {\n      fullName,'
          if old not in text:
              raise SystemExit('manual enquiry narrowing marker missing')
          p.write_text(text.replace(old, new, 1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/admin/admissions.ts
          git commit -m "fix: narrow manual enquiry validation types"
          git push origin HEAD:fix/admission-flow-reliability
