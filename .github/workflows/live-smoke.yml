name: Live production smoke

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CONFIGURED_SITE_URL: ${{ vars.SITE_URL }}
    steps:
      - name: Wait for deployed health
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${CONFIGURED_SITE_URL:-https://karma-design-studio.essanciaonline.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          echo "Checking ${BASE_URL}"

          healthy=0
          for attempt in $(seq 1 18); do
            code="$(curl --connect-timeout 10 --max-time 20 --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "${BASE_URL}/api/health" || true)"
            if [ "$code" = "200" ]; then
              healthy=1
              break
            fi
            echo "Health attempt ${attempt}/18 returned ${code:-curl-error}; waiting for deployment"
            sleep 10
          done

          if [ "$healthy" != "1" ]; then
            echo "Production health did not become ready"
            cat /tmp/health.json 2>/dev/null || true
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const body = JSON.parse(fs.readFileSync("/tmp/health.json", "utf8"));
            if (!body.ok || !body.production) throw new Error("health payload is not production-ready");
            for (const key of ["db", "supabaseAuth", "turnstile"]) {
              if (!body.checks?.[key]) throw new Error(`required health check failed: ${key}`);
            }
          '

      - name: Smoke public EN and GU routes
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${CONFIGURED_SITE_URL:-https://karma-design-studio.essanciaonline.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          check_200() {
            path="$1"
            code="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --location --output /dev/null --write-out '%{http_code}' "${BASE_URL}${path}")"
            test "$code" = "200" || { echo "${path} returned ${code}"; exit 1; }
          }

          for path in \
            /en \
            /gu \
            /en/courses \
            /gu/courses \
            /en/batches \
            /gu/batches \
            /en/admission \
            /gu/admission \
            /en/services \
            /gu/services \
            /en/about \
            /gu/about \
            /en/verify \
            /gu/verify
          do
            check_200 "$path"
          done

      - name: Verify admin boundary and security headers
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${CONFIGURED_SITE_URL:-https://karma-design-studio.essanciaonline.workers.dev}"
          BASE_URL="${BASE_URL%/}"

          login_code="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE_URL}/admin/login")"
          test "$login_code" = "200" || { echo "/admin/login returned ${login_code}"; exit 1; }

          final_url="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --location --output /dev/null --write-out '%{url_effective}' "${BASE_URL}/admin")"
          case "$final_url" in
            "${BASE_URL}/admin/login"*) ;;
            *) echo "Unauthenticated /admin ended at ${final_url}, expected /admin/login"; exit 1 ;;
          esac

          curl --connect-timeout 10 --max-time 30 --silent --show-error --dump-header /tmp/headers --output /dev/null "${BASE_URL}/en"
          for header in \
            "content-security-policy:" \
            "strict-transport-security:" \
            "x-content-type-options:" \
            "x-frame-options:" \
            "referrer-policy:"
          do
            grep -qi "^${header}" /tmp/headers || { echo "Missing security header: ${header}"; exit 1; }
          done
          grep -qi '^x-content-type-options:[[:space:]]*nosniff' /tmp/headers
          grep -qi '^x-frame-options:[[:space:]]*DENY' /tmp/headers

      - name: Verify real localized 404
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${CONFIGURED_SITE_URL:-https://karma-design-studio.essanciaonline.workers.dev}"
          BASE_URL="${BASE_URL%/}"
          for path in /en/this-route-must-not-exist /gu/this-route-must-not-exist; do
            code="$(curl --connect-timeout 10 --max-time 30 --silent --show-error --output /dev/null --write-out '%{http_code}' "${BASE_URL}${path}")"
            test "$code" = "404" || { echo "${path} returned ${code}, expected 404"; exit 1; }
          done
