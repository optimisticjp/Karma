name: Password-only cleanup

on:
  push:
    branches:
      - feat/console-reports-content-polish
    paths:
      - scripts/password-only-cleanup.mjs

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/console-reports-content-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/password-only-cleanup.mjs
      - name: Commit cleanup
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No cleanup changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add messages docs src/lib/auth/guard.ts src/lib/admin/content-copy.ts next.config.ts
          git commit -m "docs(auth): remove obsolete MFA requirements"
          git push origin HEAD:feat/console-reports-content-polish
