name: Cloudflare runtime smoke

on:
  push:
    branches: [debug/cloudflare-1101]

jobs:
  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: karma
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d karma"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      CI: "true"
      WRANGLER_SEND_METRICS: "false"
      DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/karma?sslmode=disable"
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: "postgres://postgres:postgres@127.0.0.1:5432/karma?sslmode=disable"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare realistic local Postgres
        run: |
          npm run db:migrate
          npm run db:seed
      - name: Build actual Cloudflare Worker
        run: npx opennextjs-cloudflare build
      - name: Boot Worker runtime and stress public routes
        shell: bash
        run: |
          set -euo pipefail
          npx opennextjs-cloudflare preview --port 8787 > /tmp/karma-worker.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true; cat /tmp/karma-worker.log' EXIT

          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/en -o /tmp/en.html; then
              ready=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "Worker preview exited before becoming ready"
              exit 1
            fi
            sleep 1
          done
          test "$ready" = "1"

          for path in /gu /en/courses /en/batches /en/admissions /en/about /en/services /en/student-work /en/success-stories /en/notes /en/contact; do
            curl -fsS "http://127.0.0.1:8787$path" -o /tmp/route.html
            grep -q '<html' /tmp/route.html
          done

          for path in /en/nope /gu/nope /en/courses/nope /en/notes/nope; do
            status=$(curl -sS -o /tmp/404.html -w '%{http_code}' "http://127.0.0.1:8787$path")
            test "$status" = "404"
          done

          # Simulate browser prefetch/navigation bursts and multiple simultaneous visitors.
          seq 1 80 | xargs -P 12 -I{} sh -c '
            case $(({} % 6)) in
              0) path=/en ;;
              1) path=/gu ;;
              2) path=/en/batches ;;
              3) path=/en/courses ;;
              4) path=/en/admissions ;;
              *) path=/en/about ;;
            esac
            curl -fsS "http://127.0.0.1:8787$path" -o /dev/null
          '
