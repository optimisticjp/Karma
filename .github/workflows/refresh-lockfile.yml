name: Refresh security lockfile

on:
  push:
    branches: ["chore/ops-hardening-2026-09-03"]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh Next.js maintenance lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --save-exact next@15.5.25
          npm install --package-lock-only --ignore-scripts --save-dev --save-exact eslint-config-next@15.5.25
          npm audit --omit=dev --audit-level=high
      - name: Commit refreshed lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git commit -m "security: refresh Next.js lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
