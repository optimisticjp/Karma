name: Live production check

on:
  push:
    branches: [debug/cloudflare-1101]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Worker
        shell: bash
        run: |
          set -u
          URL="https://karma-design-studio.essanciaonline.workers.dev"
          for path in / /en /gu /en/batches; do
            echo "=== $path ==="
            curl -sS -L --max-time 20 -D /tmp/headers "$URL$path" -o /tmp/body || true
            head -n 20 /tmp/headers || true
            head -c 300 /tmp/body || true
            echo
          done
