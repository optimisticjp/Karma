name: Manual enquiry source patch

on:
  push:
    branches:
      - fix/admission-flow-reliability
    paths:
      - .github/workflows/manual-enquiry-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admission-flow-reliability
      - name: Apply source patch
        run: |
          echo '' | base64 -d > /tmp/manual-enquiry-patch.py
          python3 /tmp/manual-enquiry-patch.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "fix: preserve manual enquiry errors"
          git push origin HEAD:fix/admission-flow-reliability
