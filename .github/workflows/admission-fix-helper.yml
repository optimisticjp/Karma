name: Admission fix helper

on:
  push:
    branches:
      - fix/admission-flow-reliability
    paths:
      - .github/workflows/admission-fix-helper.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/admission-flow-reliability
      - name: Apply fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:100]!r}")
              write(path, text.replace(old, new, 1))

          # Public admission: a success response must mean a row was persisted.
          path = "src/app/api/admission/route.ts"
          text = read(path)
          text, n = re.subn(r'\n  // Honeypot BEFORE validation: quiet fake success, zero signal for bots\.\n  const hp = \(body as \{ website\?: unknown \} \| null\)\?\.website;\n  if \(typeof hp === "string" && hp\.length > 0\) \{\n    return NextResponse\.json\(\{ ok: true, reference: "KDS-RECEIVED" \}\);\n  \}\n', '\n', text, count=1)
          if n != 1:
              raise SystemExit("admission honeypot branch not found")
          text, n = re.subn(r'\n  if \(Date\.now\(\) - d\.startedAt < 5000\) \{\n    return NextResponse\.json\(\{ ok: true, reference: "KDS-RECEIVED" \}\);\n  \}\n', '\n', text, count=1)
          if n != 1:
              raise SystemExit("admission fast-submit branch not found")
          write(path, text)

          path = "src/components/forms/AdmissionForm.tsx"
          text = read(path)
          for old in ['  const startedAt = useRef(Date.now());\n', '  const honeypot = useRef<HTMLInputElement>(null);\n', '          startedAt: startedAt.current,\n', '          website: honeypot.current?.value ?? "",\n']:
              if old not in text:
                  raise SystemExit(f"AdmissionForm missing {old!r}")
              text = text.replace(old, '', 1)
          old = '            {/* Honeypot */}\n            <div className="hidden" aria-hidden="true">\n              <label htmlFor="adm-website">{t("fields.website")}</label>\n              <input ref={honeypot} id="adm-website" type="text" tabIndex={-1} autoComplete="off" />\n            </div>\n\n'
          if old not in text:
              raise SystemExit("AdmissionForm honeypot block not found")
          write(path, text.replace(old, '', 1))

          # Design brief had the same false-success shortcuts.
          path = "src/app/api/brief/route.ts"
          replace(path, '  // Honeypot first (quiet fake success for bots).\n  if (typeof fields.website === "string" && fields.website.length > 0) {\n    return NextResponse.json({ ok: true, reference: "KDS-B-RECEIVED" });\n  }\n\n', '')
          replace(path, '  if (Date.now() - d.startedAt < 4000) {\n    return NextResponse.json({ ok: true, reference: "KDS-B-RECEIVED" });\n  }\n\n', '')

          path = "src/components/forms/BriefForm.tsx"
          text = read(path)
          for old in ['  const startedAt = useRef(Date.now());\n', '    fd.set("startedAt", String(startedAt.current));\n']:
              if old not in text:
                  raise SystemExit(f"BriefForm missing {old!r}")
              text = text.replace(old, '', 1)
          old = '      <div className="hidden" aria-hidden="true">\n        <label htmlFor="brief-website">Website</label>\n        <input id="brief-website" name="website" type="text" tabIndex={-1} autoComplete="off" />\n      </div>\n'
          if old not in text:
              raise SystemExit("BriefForm honeypot block not found")
          write(path, text.replace(old, '', 1))

          path = "src/lib/validation.ts"
          text = read(path)
          for old in ['    startedAt: z.number(),\n', '    website: z.string().optional() // honeypot: checked in the route BEFORE validation\n', '    startedAt: z.coerce.number(),\n', '    website: z.string().optional()\n']:
              if old not in text:
                  raise SystemExit(f"validation schema missing {old!r}")
              text = text.replace(old, '', 1)
          write(path, text)

          # Direct admission: report exact failed controls.
          path = "src/lib/admin/students.ts"
          marker = 'export function validateDirectAdmission(input: Record<string, unknown>):\n'
          if marker not in read(path):
              raise SystemExit("validateDirectAdmission marker missing")
          helper_lines = [
              'export type DirectAdmissionField =',
              '  | "fullName"',
              '  | "phone"',
              '  | "whatsapp"',
              '  | "email"',
              '  | "guardianName"',
              '  | "guardianPhone"',
              '  | "referencePhone"',
              '  | "batchId"',
              '  | "joinedOn";',
              '',
              'export function directAdmissionInvalidFields(input: Record<string, unknown>): DirectAdmissionField[] {',
              '  const invalid = new Set<DirectAdmissionField>();',
              '  const fullName = text(input.fullName, 160);',
              '  const phone = cleanIndianMobile(text(input.phone, 30));',
              '  const rawWhatsapp = text(input.whatsapp, 30);',
              '  const whatsapp = rawWhatsapp ? cleanIndianMobile(rawWhatsapp) : null;',
              '  const parsedEmail = email(input.email);',
              '  const isMinor = input.isMinor === true || input.isMinor === "on" || input.isMinor === "true";',
              '  const guardianName = optionalText(input.guardianName, 160);',
              '  const rawGuardianPhone = text(input.guardianPhone, 30);',
              '  const guardianPhone = rawGuardianPhone ? cleanIndianMobile(rawGuardianPhone) : null;',
              '  const rawReferencePhone = text(input.referencePhone, 30);',
              '  const referencePhone = rawReferencePhone ? cleanIndianMobile(rawReferencePhone) : null;',
              '',
              '  if (fullName.length < 2) invalid.add("fullName");',
              '  if (!isIndianMobile(phone)) invalid.add("phone");',
              '  if (whatsapp && !isIndianMobile(whatsapp)) invalid.add("whatsapp");',
              '  if (parsedEmail === "invalid") invalid.add("email");',
              '  if (isMinor && !guardianName) invalid.add("guardianName");',
              '  if (!guardianPhone || !isIndianMobile(guardianPhone)) invalid.add("guardianPhone");',
              '  if (guardianPhone && isIndianMobile(guardianPhone) && isIndianMobile(phone) && guardianPhone === phone) invalid.add("guardianPhone");',
              '  if (referencePhone && !isIndianMobile(referencePhone)) invalid.add("referencePhone");',
              '  if (!positiveId(input.batchId)) invalid.add("batchId");',
              '  if (optionalDate(input.joinedOn) === "invalid") invalid.add("joinedOn");',
              '  return [...invalid];',
              '}',
              '',
          ]
          text = read(path).replace(marker, '\n'.join(helper_lines) + marker, 1)
          old = '  | { ok: false } {\n  const student = validateStudentInput(input, { requireGuardian: true });\n  const batchId = positiveId(input.batchId);\n  const joinedOn = optionalDate(input.joinedOn);\n  if (!student.ok || !batchId || joinedOn === "invalid") return { ok: false };\n  return { ok: true, value: { ...student.value, batchId, joinedOn } };\n}'
          new = '  | { ok: false; invalidFields: DirectAdmissionField[] } {\n  const invalidFields = directAdmissionInvalidFields(input);\n  if (invalidFields.length > 0) return { ok: false, invalidFields };\n\n  const student = validateStudentInput(input, { requireGuardian: true });\n  const batchId = positiveId(input.batchId);\n  const joinedOn = optionalDate(input.joinedOn);\n  if (!student.ok || !batchId || joinedOn === "invalid") return { ok: false, invalidFields: [] };\n  return { ok: true, value: { ...student.value, batchId, joinedOn } };\n}'
          if old not in text:
              raise SystemExit("validateDirectAdmission body not found")
          write(path, text.replace(old, new, 1))

          # Preserve direct-admission data through all action failures.
          path = "src/app/admin/(console)/students/actions.ts"
          text = read(path)
          old = '    | "enrollmentUpdated";\n};'
          new = '    | "enrollmentUpdated";\n  values?: Record<string, string>;\n  invalidFields?: string[];\n};'
          if old not in text:
              raise SystemExit("StudentsState tail missing")
          text = text.replace(old, new, 1)
          old = '): Promise<StudentsState> {\n  const auth = await authorizeAction({ permission: "students.manage" });\n  if (!auth.ok) return errorState("denied");\n\n  const parsed = validateDirectAdmission(formObject(formData));\n  if (!parsed.ok) return errorState("invalid");\n  const db = getDb();\n  if (!db) return errorState("generic");'
          new = '): Promise<StudentsState> {\n  const submittedValues = formSnapshot(formData);\n  const auth = await authorizeAction({ permission: "students.manage" });\n  if (!auth.ok) return { ...errorState("denied"), values: submittedValues };\n\n  const parsed = validateDirectAdmission(formObject(formData));\n  if (!parsed.ok) return { ...errorState("invalid"), values: submittedValues, invalidFields: parsed.invalidFields };\n  const db = getDb();\n  if (!db) return { ...errorState("generic"), values: submittedValues };'
          if old not in text:
              raise SystemExit("direct admission action head missing")
          text = text.replace(old, new, 1)
          old = '  } catch (error) {\n    if (error instanceof SeatUnavailableError) return errorState("seat");\n    return mapDbError(error, "[students] direct admission");\n  }\n\n  revalidateStudentPaths();\n  return successState("studentCreated");\n}'
          new = '  } catch (error) {\n    if (error instanceof SeatUnavailableError) return { ...errorState("seat"), values: submittedValues };\n    return { ...mapDbError(error, "[students] direct admission"), values: submittedValues };\n  }\n\n  revalidateStudentPaths();\n  return successState("studentCreated");\n}'
          if old not in text:
              raise SystemExit("direct admission catch missing")
          text = text.replace(old, new, 1)
          marker = 'function formObject(formData: FormData): Record<string, unknown> {\n'
          helper = 'function formSnapshot(formData: FormData): Record<string, string> {\n  const result: Record<string, string> = {};\n  for (const [key, value] of formData.entries()) if (typeof value === "string") result[key] = value;\n  result.isMinor = formData.has("isMinor") ? "on" : "";\n  result.photoConsent = formData.has("photoConsent") ? "on" : "";\n  return result;\n}\n\n'
          if marker not in text:
              raise SystemExit("formObject marker missing")
          write(path, text.replace(marker, helper + marker, 1))

          # Restore submitted controls, highlight invalid ones, focus first error.
          path = "src/app/admin/(console)/students/StudentForms.tsx"
          text = read(path)
          if 'import { useActionState } from "react";' not in text:
              raise SystemExit("StudentForms React import missing")
          text = text.replace('import { useActionState } from "react";', 'import { useActionState, useEffect, useRef } from "react";', 1)
          marker = 'export function DirectAdmissionForm({ batches, copy }: { batches: BatchOption[]; copy: StudentsCopy }) {\n'
          helper_lines = [
              'function restoreSubmittedForm(form: HTMLFormElement, values?: Record<string, string>, invalidFields?: string[]) {',
              '  for (const item of Array.from(form.elements)) {',
              '    if (item instanceof HTMLInputElement || item instanceof HTMLSelectElement || item instanceof HTMLTextAreaElement) {',
              '      item.classList.remove("input-error");',
              '      item.removeAttribute("aria-invalid");',
              '    }',
              '  }',
              '  for (const [name, value] of Object.entries(values ?? {})) {',
              '    const item = form.elements.namedItem(name);',
              '    if (item instanceof HTMLInputElement && item.type === "checkbox") item.checked = value === "on" || value === "true";',
              '    else if (item instanceof HTMLInputElement || item instanceof HTMLSelectElement || item instanceof HTMLTextAreaElement) item.value = value;',
              '  }',
              '  let first: HTMLInputElement | HTMLSelectElement | HTMLTextAreaElement | null = null;',
              '  for (const name of invalidFields ?? []) {',
              '    const item = form.elements.namedItem(name);',
              '    if (item instanceof HTMLInputElement || item instanceof HTMLSelectElement || item instanceof HTMLTextAreaElement) {',
              '      item.classList.add("input-error");',
              '      item.setAttribute("aria-invalid", "true");',
              '      first ??= item;',
              '    }',
              '  }',
              '  first?.focus();',
              '}',
              '',
          ]
          if marker not in text:
              raise SystemExit("DirectAdmissionForm marker missing")
          text = text.replace(marker, '\n'.join(helper_lines) + marker, 1)
          old = '  const [state, action] = useActionState<StudentsState, FormData>(directAdmissionAction, IDLE);\n  return (\n    <form action={action} className="grid gap-5">'
          new = '  const [state, action] = useActionState<StudentsState, FormData>(directAdmissionAction, IDLE);\n  const formRef = useRef<HTMLFormElement>(null);\n\n  useEffect(() => {\n    if (!formRef.current || (!state.values && !state.invalidFields)) return;\n    const frame = requestAnimationFrame(() => {\n      if (formRef.current) restoreSubmittedForm(formRef.current, state.values, state.invalidFields);\n    });\n    return () => cancelAnimationFrame(frame);\n  }, [state.values, state.invalidFields]);\n\n  return (\n    <form ref={formRef} action={action} className="grid gap-5">'
          if old not in text:
              raise SystemExit("DirectAdmissionForm body missing")
          write(path, text.replace(old, new, 1))

          # One-shot helper must never reach main.
          Path('.github/workflows/admission-fix-helper.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make admission submissions reliable"
          git push origin HEAD:fix/admission-flow-reliability
