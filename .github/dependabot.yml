version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
      time: "04:00"
      timezone: "Asia/Kolkata"
    # Routine version updates are paused while the product is still being
    # finished and polished. Dependabot security updates use a separate limit
    # and remain available when a vulnerability needs remediation.
    open-pull-requests-limit: 0
    allow:
      # Retain the intended non-breaking policy for when routine maintenance
      # is re-enabled after product polish.
      - dependency-name: "*"
        update-types:
          - version-update:semver-patch
          - version-update:semver-minor
    groups:
      production-maintenance:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - patch
          - minor
      development-maintenance:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - patch
          - minor
      security-maintenance:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      # Keep the qualified Next/OpenNext/Cloudflare/i18n toolchain on its
      # current minor lines while the site is still being finished. Patch and
      # security updates remain eligible when routine maintenance is resumed.
      - dependency-name: next
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: eslint-config-next
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: next-intl
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: "@opennextjs/cloudflare"
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
      - dependency-name: wrangler
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
      time: "04:15"
      timezone: "Asia/Kolkata"
    # Routine GitHub Actions updates are paused during product polish;
    # security updates remain available separately.
    open-pull-requests-limit: 0
